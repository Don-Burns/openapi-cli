default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: local
    hooks:
      - id: lint
        name: lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: format
        name: format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: type-check
        name: type-check
        entry: uv run mypy .
        language: system
        pass_filenames: false
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []
