[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openapi-preview"
version = "0.1.0"
description = "A local preview server for OpenAPI YAML files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["swagger-ui-bundle>=1.1,<2"]

[project.scripts]
openapi = "openapi_preview.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openapi_preview"]

[tool.pytest.ini_options]
pythonpath = ["src"]
